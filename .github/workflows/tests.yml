# Verification automatique a chaque envoi : tests, controle TypeScript et construction.
# Une croix rouge dans GitHub = quelque chose est casse, a ne pas fusionner.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock pointe vers le cache prive de Lovable : installation depuis le registre public
      - name: Installer
        run: |
          set -o pipefail
          npm pkg set overrides.@types/estree=1.0.8
          npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps 2>&1 | tee install.log || { grep -iE "ERR|error" install.log | head -n 15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Tests
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee step.log || { grep -E "FAIL|Error|expected|×" step.log | head -n 20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Controle TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee step.log || { head -n 25 step.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Construction
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee step.log || { tail -n 20 step.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
